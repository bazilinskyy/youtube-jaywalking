[project]
name = "crowd-jaywalking"
version = "1.1.0"
description = "Per-person jaywalking detection using tracked crossing events and global VLM context."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "accelerate>=0.26",
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8",
    "lap>=0.5.12",
    "pillow>=10.0",
    "qwen-vl-utils>=0.0.8",
    "safetensors>=0.4",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.49,<5.0",
    "ultralytics>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowd_jaywalking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

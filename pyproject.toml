[project]
name = "crowd-jaywalking"
version = "1.0.0"
description = "Multimodal zero-shot jaywalking detection framework combining vision-language models, pedestrian pose tracking, and semantic road surface segmentation."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "ultralytics>=8.0.220",
    "transformers>=4.35.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "plotly>=5.18.0",
    "kaleido>=1",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "lapx>=0.5.5",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "pyflakes>=3.2.0",
    "pycodestyle>=2.12.0",
    "mccabe>=0.7.0",
    "yamllint>=1.35.0",
    "pathspec>=0.12.0",
    "pytest>=8.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
